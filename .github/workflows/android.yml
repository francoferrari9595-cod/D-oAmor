name: Generar APK Android - KOMBO ARENA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kombo-arena-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias Android sin interacción
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager en $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Asignar versión única y creciente a esta publicación
        shell: bash
        run: |
          set -euo pipefail
          # El versionCode sale del reloj (minutos desde 1970): siempre crece, sin importar qué archivos
          # se suban al repositorio ni cuántas veces se reemplace main. Así el teléfono siempre ve la versión como nueva.
          export VERSION_CODE="$(( $(date -u +%s) / 60 ))"
          export VERSION_NAME="$(date -u +%Y.%m.%d.%H%M)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          c = path.read_text()
          c, n1 = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', lambda m: m.group(1) + os.environ["VERSION_CODE"], c, count=1)
          c, n2 = re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]*"', lambda m: m.group(1) + '"' + os.environ["VERSION_NAME"] + '"', c, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("No se pudieron detectar versionCode/versionName en app/build.gradle.kts")
          path.write_text(c)
          print("Versión de esta compilación:", os.environ["VERSION_NAME"], "(code", os.environ["VERSION_CODE"] + ")")
          PYCODE

      - name: Validar firma debug estable
        shell: bash
        run: |
          set -euo pipefail
          test -s debug.keystore || { echo "::error::Falta debug.keystore estable en la raíz del proyecto."; exit 1; }
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Preparar Firebase si existe el secreto
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f app/google-services.json ]; then
            echo "Se encontró app/google-services.json."
          else
            echo "::warning::Falta Firebase: el APK de prueba puede compilar, pero Google Sign-In y la conexión Firebase no funcionarán hasta agregar la configuración real."
          fi

      - name: Validar sintaxis de Cloud Functions
        run: node --check functions/index.js

      - name: Ejecutar pruebas unitarias Android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar APK con nombre final
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KOMBO-ARENA.apk
          ls -lh dist/KOMBO-ARENA.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: KOMBO-ARENA-APK
          path: dist/KOMBO-ARENA.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK permanente para actualizaciones
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: KOMBO ARENA - APK Android
          body: "Descarga oficial del APK Android generado por GitHub Actions."
          files: dist/KOMBO-ARENA.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar metadatos de actualización para la próxima apertura de la app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Se parte siempre del main más reciente: no hay conflictos aunque se haya subido algo mientras compilaba.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B update-meta origin/main
            node -e '
              const fs = require("fs");
              let d = {};
              try { d = JSON.parse(fs.readFileSync("update.json", "utf8")); } catch (e) {}
              d.latestVersionCode = Number(process.env.VERSION_CODE);
              d.versionName = process.env.VERSION_NAME;
              d.apkUrl = "https://github.com/" + process.env.GITHUB_REPOSITORY + "/releases/download/android-latest/KOMBO-ARENA.apk";
              if (d.minimumSupportedVersionCode === undefined) d.minimumSupportedVersionCode = 0;
              // «forceThisRelease»: esta publicación es OBLIGATORIA. Todo teléfono con una versión anterior queda
              // bloqueado hasta actualizar (el aviso no tiene «Más tarde»). Se apaga solo para la siguiente publicación.
              if (d.forceThisRelease === true) {
                d.minimumSupportedVersionCode = Number(process.env.VERSION_CODE);
                d.forceThisRelease = false;
              }
              if (!d.releaseNotes) d.releaseNotes = "Hay mejoras y correcciones disponibles.";
              fs.writeFileSync("update.json", JSON.stringify(d, null, 2) + "\n");
            '
            git add update.json
            if git diff --cached --quiet; then echo "update.json ya estaba al día"; exit 0; fi
            git commit -m "chore(android): publish version $VERSION_NAME update metadata"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "::error::No se pudo publicar update.json en main."
          exit 1
