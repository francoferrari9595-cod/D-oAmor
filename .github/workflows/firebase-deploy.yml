name: Publicar reglas Firebase - SINI-JOSS-NUEVO

on:
  workflow_dispatch:
  # Cada vez que cambian las reglas en main, se publican solas (si el secreto está configurado).
  push:
    branches: ["main"]
    paths:
      - "firestore.rules"
      - "firebase.json"

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Publicar únicamente reglas de Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SINI_JOSS_NUEVO }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT_SINI_JOSS_NUEVO: las reglas NO se publicaron. Pega el contenido de firestore.rules en Firebase Console → Firestore → Reglas → Publicar."
              exit 0
            fi
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT_SINI_JOSS_NUEVO en GitHub."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only firestore:rules --project sini-joss-nuevo --non-interactive
